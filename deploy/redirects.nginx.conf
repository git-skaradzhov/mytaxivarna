# Do not install until the production migration is an explicit task.
# Every rule sends the visitor to the final URL in one step.

server {
    listen 443 ssl;
    server_name taxialbena.com www.taxialbena.com;
    return 301 https://mytaxivarna.com/taxi-albena/;
}

server {
    listen 443 ssl;
    server_name taxikranevo.com www.taxikranevo.com;
    return 301 https://mytaxivarna.com/taxi-kranevo/;
}

server {
    listen 443 ssl;
    server_name airporttaxitransfersvarna.com www.airporttaxitransfersvarna.com;

    location = / { return 301 https://mytaxivarna.com/varna-airport-transfers/; }
    location = /destinations/varna-to-golden-sands { return 301 https://mytaxivarna.com/varna-airport-to-golden-sands/; }
    location = /destinations/varna-to-albena { return 301 https://mytaxivarna.com/varna-airport-to-albena/; }
    location = /destinations/varna-to-kranevo { return 301 https://mytaxivarna.com/varna-airport-to-kranevo/; }
    location = /destinations/varna-to-balchik { return 301 https://mytaxivarna.com/varna-airport-to-balchik/; }
}

# On mytaxivarna.com itself, after the host is already canonical:
# location = /golden-sands { return 301 https://mytaxivarna.com/taxi-golden-sands/; }
