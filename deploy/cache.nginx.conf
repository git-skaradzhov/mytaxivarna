# Browser cache and compression for static files. Safe to enable at launch.
# Include inside the mytaxivarna.com server block.
# CSS and JS URLs carry ?ver=, so a new deploy changes the URL and skips the old cache.

gzip on;
gzip_types text/css text/plain text/xml application/javascript text/javascript application/json application/xml image/svg+xml;

location ~* \.(?:css|js|woff2)$ {
    expires 1y;
    access_log off;
    try_files $uri =404;
}

location ~* \.(?:webp|jpe?g|png|svg|ico)$ {
    expires 30d;
    access_log off;
    try_files $uri =404;
}
