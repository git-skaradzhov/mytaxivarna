# Do not enable until the production migration is an explicit task.
# Each source goes to the final URL in one step.

<IfModule mod_rewrite.c>
RewriteEngine On

RewriteCond %{HTTP_HOST} ^(www\.)?taxialbena\.com$ [NC]
RewriteRule ^$ https://mytaxivarna.com/taxi-albena/ [R=301,L]

RewriteCond %{HTTP_HOST} ^(www\.)?taxikranevo\.com$ [NC]
RewriteRule ^$ https://mytaxivarna.com/taxi-kranevo/ [R=301,L]

RewriteCond %{HTTP_HOST} ^(www\.)?airporttaxitransfersvarna\.com$ [NC]
RewriteRule ^$ https://mytaxivarna.com/varna-airport-transfers/ [R=301,L]

RewriteCond %{HTTP_HOST} ^(www\.)?airporttaxitransfersvarna\.com$ [NC]
RewriteRule ^destinations/varna-to-golden-sands/?$ https://mytaxivarna.com/varna-airport-to-golden-sands/ [R=301,L]
RewriteCond %{HTTP_HOST} ^(www\.)?airporttaxitransfersvarna\.com$ [NC]
RewriteRule ^destinations/varna-to-albena/?$ https://mytaxivarna.com/varna-airport-to-albena/ [R=301,L]
RewriteCond %{HTTP_HOST} ^(www\.)?airporttaxitransfersvarna\.com$ [NC]
RewriteRule ^destinations/varna-to-kranevo/?$ https://mytaxivarna.com/varna-airport-to-kranevo/ [R=301,L]
RewriteCond %{HTTP_HOST} ^(www\.)?airporttaxitransfersvarna\.com$ [NC]
RewriteRule ^destinations/varna-to-balchik/?$ https://mytaxivarna.com/varna-airport-to-balchik/ [R=301,L]
</IfModule>
